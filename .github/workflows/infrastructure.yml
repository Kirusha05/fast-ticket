name: Infrastructure
on:
  # will run "terraform plan" only on PRs towards main (most critical ones)
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/prod/**"
      - ".github/workflows/infrastructure.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/prod/**"
      - ".github/workflows/infrastructure.yml"

# This config effectively creates a single-lane queue: only one terraform init/plan/apply sequence touches infrastructure/prod at a time, across all PRs and pushes
# PR checks should always be relative to the latest applied state, so applies HAVE TO finish first so the plan reflects updates on the latest state
concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infrastructure/prod
    # run the job only if there's a push event (can be triggered just by us) or a PR coming from branches inside our own repo
    # this prevents the job from running as a result of PRs coming from public forks
    # so fork PRs won't consume queue time and won't block our legitimate jobs
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          # use terraform-runner SA (can run "terraform apply") for pushes on "main" branch
          # or terraform-planner SA (can run "terraform plan") for PRs towards "main" branch
          service_account:
            >- # using && and ||, as Github does not have the ternary operator ?/:
            ${{ github.event_name == 'push'
                && format('terraform-runner@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID)
                || format('terraform-planner@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

      - uses: hashicorp/setup-terraform@v4

      - run: terraform fmt -check
      - run: terraform init
      - run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
          PLAN_OUTCOME: "${{ steps.plan.outcome }}"
        with:
          script: |
            const maxLength = 65000; // GitHub comment body limit is ~65536 chars
            let plan = process.env.PLAN || '';
            let truncated = false;
            if (plan.length > maxLength) {
              plan = plan.slice(-maxLength);
              truncated = true;
            }

            const outcome = process.env.PLAN_OUTCOME;
            const marker = '<!-- terraform-plan-comment -->';

            const body = `${marker}
            ### Terraform Plan Result: \`${outcome}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${truncated ? '... (truncated) ...\n' : ''}${plan}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # run terraform apply just after a PR was merged into "main", triggering the push event
      - if: github.event_name == 'push'
        run: terraform apply -auto-approve

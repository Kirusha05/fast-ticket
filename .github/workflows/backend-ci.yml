name: Backend CI

on:
  push:
    paths:
      - "backend/**"

  pull_request:
    # paths:
    #   - "backend/**"

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres_test
        ports:
          - 6432:5432  # 6432, as 5432 is running the local dev database, .env.test uses 6432
        options: >-  # GitHub waits until pg_isready returns success
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Restore dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen  # install exactly what's inside uv.lock

      - name: Run Alembic migrations
        run: MODE=test uv run alembic upgrade head  # MODE=test will load the env vars from .env.test

      - name: Run pytest
        run: MODE=test uv run pytest tests/api
name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"

  pull_request:
    paths:
      - "frontend/**"

jobs:
  test:
    # currently no real frontend testing, just verifying that the app builds without errors
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build